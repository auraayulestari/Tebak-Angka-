<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Matematika Elegan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Background gradient gelap elegan */
      background: linear-gradient(135deg, #0d1117, #161b22, #1f2937);
      color: #f3f4f6;
    }

    .game-card {
      background: rgba(22, 27, 34, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2.5rem 2rem;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    /* Styling Tambahan untuk Logo */
    .game-logo {
      width: 70px;
      height: auto;
      margin-bottom: 0.8rem;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: #9ca3af;
      margin-bottom: 1.8rem;
    }

    .stats-board {
      display: flex;
      justify-content: space-around;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 16px;
      margin-bottom: 1.5rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.2rem;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f9fafb;
    }

    .level-select {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    label {
      font-size: 0.8rem;
      color: #d1d5db;
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }

    select {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid #374151;
      background: #111827;
      color: #f3f4f6;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: #60a5fa;
    }

    .question-box {
      background: rgba(31, 41, 55, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1.2rem;
      border-radius: 16px;
      font-size: 2rem;
      font-weight: 700;
      color: #f3f4f6;
      margin-bottom: 1.2rem;
      letter-spacing: 1px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 1.2rem;
    }

    input[type="number"] {
      flex: 1;
      padding: 0.8rem;
      border-radius: 12px;
      border: 1px solid #374151;
      background: #111827;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: #60a5fa;
    }

    button {
      padding: 0.8rem 1.4rem;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-submit {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }

    .btn-reset {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      color: #d1d5db;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #f3f4f6;
    }

    .message {
      min-height: 2.2rem;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .msg-success { color: #34d399; }
    .msg-error { color: #f87171; }
    .msg-info { color: #fbbf24; }
  </style>
</head>
<body>

  <div class="game-card">
    <!-- Penambahan Logo Game di Sini -->
    <img src="logo.jpeg" alt="Logo Math Challenge" class="game-logo">

    <h1>Math Challenge</h1>
    <p class="subtitle">Uji kecepatan dan ketepatan berhitungmu!</p>

    <div class="stats-board">
      <div class="stat-box">
        <span class="stat-label">Skor</span>
        <span id="scoreDisplay" class="stat-value">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Waktu</span>
        <span id="timerDisplay" class="stat-value">10s</span>
      </div>
    </div>

    <div class="level-select">
      <label for="levelSelect">Tingkat Kesulitan:</label>
      <select id="levelSelect" onchange="resetGame()">
        <option value="easy">Mudah (Tambah & Kurang)</option>
        <option value="medium" selected>Sedang (Termasuk Perkalian)</option>
        <option value="hard">Sulit (Semua Operasi & Angka Besar)</option>
      </select>
    </div>

    <div id="questionBox" class="question-box">? + ?</div>

    <div class="input-group">
      <input type="number" id="answerInput" placeholder="Jawaban..." autocomplete="off">
      <button class="btn-submit" onclick="checkAnswer()">Jawab</button>
    </div>

    <div id="message" class="message">Pilih level dan siap untuk mulai!</div>

    <button class="btn-reset" onclick="resetGame()">Ulangi Game</button>
  </div>

  <script>
    let currentScore = 0;
    let correctAnswer = 0;
    let timer = null;
    let timeLeft = 10;
    let isGameOver = false;

    const levelSettings = {
      easy: { time: 12, maxNum: 20, operators: ['+', '-'] },
      medium: { time: 10, maxNum: 50, operators: ['+', '-', '*'] },
      hard: { time: 8, maxNum: 100, operators: ['+', '-', '*', '/'] }
    };

    function generateQuestion() {
      const level = document.getElementById('levelSelect').value;
      const config = levelSettings[level];
      const operator = config.operators[Math.floor(Math.random() * config.operators.length)];
      
      let num1, num2;

      if (operator === '+') {
        num1 = Math.floor(Math.random() * config.maxNum) + 1;
        num2 = Math.floor(Math.random() * config.maxNum) + 1;
        correctAnswer = num1 + num2;
      } else if (operator === '-') {
        num1 = Math.floor(Math.random() * config.maxNum) + 1;
        num2 = Math.floor(Math.random() * num1) + 1; // Agar hasil selalu positif
        correctAnswer = num1 - num2;
      } else if (operator === '*') {
        const maxMult = level === 'hard' ? 15 : 10;
        num1 = Math.floor(Math.random() * maxMult) + 2;
        num2 = Math.floor(Math.random() * maxMult) + 2;
        correctAnswer = num1 * num2;
      } else if (operator === '/') {
        num2 = Math.floor(Math.random() * 10) + 2;
        correctAnswer = Math.floor(Math.random() * 10) + 1;
        num1 = num2 * correctAnswer; // Agar hasil pembagian berupa angka bulat
      }

      // Tampilan simbol matematika
      let symbol = operator;
      if (operator === '*') symbol = '×';
      if (operator === '/') symbol = '÷';

      document.getElementById('questionBox').innerText = `${num1} ${symbol} ${num2}`;
      startTimer(config.time);
    }

    function startTimer(seconds) {
      clearInterval(timer);
      timeLeft = seconds;
      document.getElementById('timerDisplay').innerText = `${timeLeft}s`;

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timerDisplay').innerText = `${timeLeft}s`;

        if (timeLeft <= 0) {
          clearInterval(timer);
          handleTimeOut();
        }
      }, 1000);
    }

    function checkAnswer() {
      if (isGameOver) return;

      const inputElement = document.getElementById('answerInput');
      const userAnswer = parseInt(inputElement.value);
      const msgElement = document.getElementById('message');

      if (isNaN(userAnswer)) {
        msgElement.innerText = "Masukkan angka jawaban!";
        msgElement.className = "message msg-error";
        return;
      }

      if (userAnswer === correctAnswer) {
        clearInterval(timer);
        currentScore += 10;
        document.getElementById('scoreDisplay').innerText = currentScore;
        msgElement.innerText = "✨ Tepat sekali! +10 Poin";
        msgElement.className = "message msg-success";
        
        inputElement.value = '';
        generateQuestion();
      } else {
        clearInterval(timer);
        msgElement.innerText = `💥 Salah! Jawaban yang benar adalah ${correctAnswer}.`;
        msgElement.className = "message msg-error";
        endGame();
      }
    }

    function handleTimeOut() {
      const msgElement = document.getElementById('message');
      msgElement.innerText = `⏰ Waktu Habis! Jawaban yang benar adalah ${correctAnswer}.`;
      msgElement.className = "message msg-error";
      endGame();
    }

    function endGame() {
      isGameOver = true;
      document.getElementById('answerInput').disabled = true;
    }

    function resetGame() {
      clearInterval(timer);
      currentScore = 0;
      isGameOver = false;
      
      document.getElementById('scoreDisplay').innerText = currentScore;
      document.getElementById('answerInput').disabled = false;
      document.getElementById('answerInput').value = '';
      
      const msgElement = document.getElementById('message');
      msgElement.innerText = "Game dimulai! Jawab sebelum waktu habis.";
      msgElement.className = "message msg-info";

      generateQuestion();
    }

    // Mendukung tombol Enter untuk menjawab
    document.getElementById('answerInput').addEventListener('keyup', function(event) {
      if (event.key === 'Enter') {
        checkAnswer();
      }
    });

    // Jalankan game saat halaman dimuat
    resetGame();
  </script>
</body>
</html>
